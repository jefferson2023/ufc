<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Vegas 122 - Allen vs. Duncan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Oswald para fontes estilo UFC -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Flags CSS para bandeiras -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css"/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ufcRed: '#D20A0A',
                        ufcDark: '#0B0B0B',
                        ufcCard: '#161616',
                    },
                    fontFamily: {
                        oswald: ['Oswald', 'sans-serif'],
                        roboto: ['Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #0b0b0b; color: #ffffff; }
    </style>
</head>
<body class="bg-ufcDark min-h-screen pb-12">

    <!-- Cabeçalho / Transmissão ao Vivo -->
    <header class="bg-gradient-to-b from-black via-zinc-900 to-ufcDark border-b border-zinc-800 py-4 px-4 text-center">
        <div class="max-w-md mx-auto flex flex-col items-center justify-center space-y-3">
            <!-- Caixa de Destaque do Horário -->
            <div class="w-full bg-gradient-to-r from-red-950 via-zinc-900 to-red-950 border-2 border-red-600/80 rounded-xl py-3 px-4 shadow-[0_0_15px_rgba(210,10,10,0.3)] text-center">
                <span class="font-oswald text-sm sm:text-base font-bold uppercase tracking-wider text-white block">
                    TRANSMISSÃO AO VIVO • COMEÇA ÀS 17:00
                </span>
                <span class="text-xs text-zinc-400 font-medium uppercase tracking-wide block mt-0.5">
                    Sábado, 10 de Outubro de 2026 • Meta Apex, Las Vegas
                </span>
            </div>

            <!-- Banner Gráfico do Card Principal (Lendo direto do seu GitHub) -->
            <div class="w-full rounded-xl overflow-hidden border border-zinc-700 shadow-2xl bg-black">
                <img src="ufc 10-10-2026.jpg" alt="UFC Vegas 122: Allen vs. Duncan - Card Principal" class="w-full h-auto object-cover">
            </div>
        </div>
    </header>

</body>
</html>
