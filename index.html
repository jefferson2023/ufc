<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Hoje - Card Principal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #060608;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .horario-badge {
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 10px 24px;
            border-radius: 6px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-image: linear-gradient(135deg, #d4af37, #ff0000) 1;
            border-style: solid;
            border-width: 2px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.15);
            text-align: center;
            width: 100%;
        }
        .horario-badge span {
            color: #d4af37;
        }
        .banner-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.1);
            border: 1px solid #1c1c1f;
        }
        .banner {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Horário reposicionado no topo com design premium de transmissão -->
        <div class="horario-badge">
            Transmissão ao vivo <span>•</span> Começa às 17:00
        </div>

        <!-- Box do Banner apontando para o caminho correto do seu GitHub -->
        <div class="banner-wrapper">
            <img class="banner" src="images/cartaz.jpg" alt="UFC Hoje — Card Principal">
        </div>
    </div>

</body>
</html>
