<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>UFC - Transmissão ao Vivo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ufcDark: '#0B0B0B',
                    }
                }
            }
        }

    <style>

<body class="bg-ufcDark min-h-screen pb-12">

            <!-- Banner Gráfico do Card Principal -->
            <div class="w-full rounded-xl overflow-hidden border border-zinc-700 shadow-2xl bg-black">
