<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Hoje - Card Principal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b0d;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        .banner {
            width: 100%;
            height: auto;
            display: block;
        }
        .horario-badge {
            background: linear-gradient(135deg, #cc0000 0%, #b38f00 100%);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 15px 40px;
            border-radius: 50px;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            text-transform: uppercase;
            margin-top: -25px;
            z-index: 10;
            border: 2px solid #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Caminho corrigido para puxar da pasta images e com o formato correto .jpg -->
        <img class="banner" src="images/cartaz.jpg" alt="UFC Hoje">
        <div class="horario-badge">
            Começa às 17:00
        </div>
    </div>

</body>
</html>
